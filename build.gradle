plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version + "-" + minecraft_version
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version "21.1.233"

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {

        MainDev {
            client()
            gameDirectory = file("run/main_dev")
            programArgument "--username=MainDev"
        }

        OffDev {
            client()
            gameDirectory = file("run/off_dev")
            programArgument "--username=OffDev"
        }

        server {
            server()
            gameDirectory = file("run/server")
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    implementation "curse.maven:elite-mobs-2-1583529:9092606"

    implementation "curse.maven:ftb-library-forge-404465:9008089"
    implementation "curse.maven:ftb-chunks-forge-314906:8791113"
    implementation "curse.maven:ftb-teams-forge-404468:8724782"
}

repositories {
    maven { url = "https://cursemaven.com" }
}


tasks.withType(ProcessResources).configureEach {
    var properties = [
            mod_version         : mod_version,
    ]

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand properties
    }
}